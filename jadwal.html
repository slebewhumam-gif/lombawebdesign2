<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <script src="js/tema.js"></script>
  <script src="js/proteksi.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EduSmart">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1b2a4a">
  <title>Jadwal EduSmart</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main>
    <h1>Jadwal</h1>
    <p class="lead">Catat kegiatan belajarmu. Jadwal hari ini tampil di Dashboard.</p>
    <div class="g2 eq">
      <section class="card">
        <div class="mn"><button id="pv" aria-label="Bulan sebelumnya">‹</button><b id="mt"></b><button id="nb"
            aria-label="Bulan berikutnya">›</button></div>
        <div class="cal" id="cal"></div>
      </section>
      <section class="card">
        <h2>Kegiatan Mendatang</h2>
        <ul style="padding:0" id="ls"></ul>
        <form id="f"><label for="j">Kegiatan baru</label><input id="j" required maxlength="60"
            placeholder="Contoh: Kuis Pemrograman">
          <div class="row" style="margin-top:8px"><input id="t" type="date" required style="flex:1"><input id="m"
              type="time" style="flex:1"></div>
          <div class="row"><button class="btn">Tambah jadwal</button></div>
        </form>
      </section>
    </div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    boot(function () {
      var BLN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'], now = new Date(), vy = now.getFullYear(), vm = now.getMonth(), pil = iso(now);
      function kal() {
        var pad = (new Date(vy, vm, 1).getDay() + 6) % 7, n = new Date(vy, vm + 1, 0).getDate(), h = '';
        $('mt').textContent = BLN[vm] + ' ' + vy;
        ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].forEach(function (x) { h += '<span>' + x + '</span>'; });
        for (var i = 0; i < pad; i++)
          h += '<i></i>';
        for (var d = 1; d <= n; d++) {
          var k = vy + '-' + String(vm + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0'), c = [];
          if (S.events.some(function (e) { return e.tgl === k; }))
            c.push('has');
          if (k === iso(now))
            c.push('today');
          if (k === pil)
            c.push('on');
          h += '<button data-d="' + k + '" class="' + c.join(' ') + '">' + d + '</button>';
        }
        $('cal').innerHTML = h;
      }
      function daftar() {
        var a = S.events.filter(function (e) { return e.tgl >= iso(now); }).sort(function (x, y) { return (x.tgl + (x.jam || '')).localeCompare(y.tgl + (y.jam || '')); });
        $('ls').innerHTML = a.map(function (e) { var d = new Date(e.tgl + 'T00:00'); return '<li class="ev"><span class="dt">' + d.getDate() + '<small>' + d.toLocaleDateString('id-ID', { month: 'short' }) + '</small></span><div><b>' + esc(e.judul) + '</b><div class="mut">' + (e.jam || 'Sepanjang hari') + '</div></div><button class="x" data-x="' + e.id + '" aria-label="Hapus">×</button></li>'; }).join('') || '<li class="empty" style="list-style:none">Belum ada kegiatan mendatang.</li>';
      }
      $('pv').onclick = function () {
        if (--vm < 0) {
          vm = 11;
          vy--;
        } kal();
      };
      $('nb').onclick = function () {
        if (++vm > 11) {
          vm = 0;
          vy++;
        } kal();
      };
      $('cal').onclick = function (e) {
        var b = e.target.closest('[data-d]'); if (b) {
          pil = b.dataset.d;
          $('t').value = pil;
          kal();
        }
      };
      $('ls').onclick = function (e) {
        var x = e.target.closest('[data-x]'); if (x) {
          S.events = S.events.filter(function (v) { return v.id != x.dataset.x; });
          save();
          kal();
          daftar();
        }
      };
      $('f').onsubmit = function (e) {
        e.preventDefault(); var j = $('j').value.trim(); if (!j || !$('t').value)
          return; S.events.push({ id: Date.now(), judul: j, tgl: $('t').value, jam: $('m').value }); save(); $('j').value = ''; kal(); daftar(); toast('Jadwal ditambahkan');
      };
      $('t').value = pil;
      kal();
      daftar();
    });
  </script>
</body>

</html>
